services:
  vaultwarden:
    image: vaultwarden/server:alpine
    container_name: vaultwarden
    restart: always

    ports:
      - "8080:80"

    volumes:
      - vaultwarden-data:/data

    environment:
      - TZ=Asia/Kuala_Lumpur
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-true}

volumes:
  vaultwarden-data:
    external: true
    name: vaultwarden_vaultwarden-data
